
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SoloMind{% endblock %} — Business Launch Tracker</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 0 auto; padding: 1rem; line-height: 1.5; }
    nav a { margin-right: 1rem; }
    .error { color: #b00020; margin: 0.25rem 0; }
    .field { margin-bottom: 1rem; }
    .field label { display: block; font-weight: bold; }
    input[type=text], input[type=date], textarea { width: 100%; padding: 0.4rem; box-sizing: border-box; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 0.4rem; border-bottom: 1px solid #ddd; }
  </style>
</head>
<body>
  <header>
    <h2>SoloMind — Business Launch Tracker</h2>
    <nav>
      <a href="{{ url_for('task_list') }}">Tasks</a>
      <a href="{{ url_for('task_new') }}">New task</a>
      <a href="{{ url_for('contact') }}">Contact</a>
    </nav>
  </header>
  <hr>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
